# ~/.tmux.conf - 独立TUI配置（荧光绿色系）
# 不依赖DMS/kitty，仅用于foot/tmux独立环境

# ── 基础设置 ──
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g clock-mode-style 24

# ── 终端颜色 ──
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── 窗口分割（使用|和-） ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── 面板切换（vim风格） ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── 面板大小调整 ──
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ── 状态栏（荧光绿色系，管道风格） ──
set -g status-position top
set -g status-interval 5

# 状态栏颜色
set -g status-style "bg=#002200,fg=#33ff33"

# 左侧状态
set -g status-left-length 40
set -g status-left "#[fg=#002200,bg=#33ff33,bold] #S #[fg=#33ff33,bg=#002200] "

# 右侧状态
set -g status-right-length 60
set -g status-right "#[fg=#66ff66]#(whoami) #[fg=#33ff33]@ #[fg=#66ff66]#h #[fg=#33ff33]│ #[fg=#8a8a8a]%H:%M #[fg=#33ff33]│ #[fg=#66ff66]%m-%d"

# 窗口标签
setw -g window-status-format "#[fg=#66ff66] #I:#W "
setw -g window-status-current-format "#[fg=#002200,bg=#33ff33,bold] #I:#W #[fg=#33ff33,bg=#002200]"
setw -g window-status-separator ""

# 窗口分隔线
set -g pane-border-style "fg=#33ff33"
set -g pane-active-border-style "fg=#66ff66"

# 消息样式
set -g message-style "fg=#33ff33,bg=#002200,bold"

# ── 复制模式（vim风格） ──
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── 重新加载配置 ──
bind r source-file ~/.tmux.conf \; display "配置已重新加载"

# ── 快速切换窗口 ──
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
