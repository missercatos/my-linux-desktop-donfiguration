<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 220px; font: 14px sans-serif; margin: 0; padding: 12px; }
    label { display: block; margin: 8px 0 2px; }
    input[type="range"] { width: 100%; }
    .row { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="row">
    <label for="enabled">启用毛玻璃</label>
    <input type="checkbox" id="enabled" />
  </div>
  <label for="alpha">透明度 (0=全透明 1=不透明)</label>
  <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5" />
  <label for="blur">模糊强度 (px)</label>
  <input type="range" id="blur" min="0" max="40" step="1" value="10" />

  <script src="popup.js"></script>
</body>
</html>
