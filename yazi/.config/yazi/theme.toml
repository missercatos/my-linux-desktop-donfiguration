# yazi/theme.toml - 独立荧光绿色系主题
# 仅用于foot/tmux，不依赖DMS
# 格式基于matugen模板修正版

# : Manager [[[

[mgr]
cwd = { fg = "#33ff33" }

# Find
find_keyword  = { fg = "#66ff66", bold = true, italic = true, underline = true }
find_position = { fg = "#66ff66", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#002200", bg = "#33ff33" }
marker_cut      = { fg = "#002200", bg = "#00aa00" }
marker_marked   = { fg = "#002200", bg = "#66ff66" }
marker_selected = { fg = "#002200", bg = "#99ff99" }

# Count
count_copied   = { fg = "#002200", bg = "#33ff33" }
count_cut      = { fg = "#002200", bg = "#00aa00" }
count_selected = { fg = "#002200", bg = "#66ff66" }

# Border
border_symbol = "│"
border_style  = { fg = "#33ff33" }

# : ]]]

# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#002200", bold = true, bg = "#33ff33" }
inactive  = { fg = "#33ff33", bg = "#002200" }
sep_inner = { open = "[", close = "]" }

# : ]]]

# : Mode [[[

[mode]
normal_main  = { bg = "#33ff33", fg = "#002200", bold = true }
normal_alt   = { bg = "#66ff66", fg = "#002200", bold = true }
select_main  = { bg = "#00aa00", fg = "#002200", bold = true }
select_alt   = { bg = "#00cc44", fg = "#002200", bold = true }
unset_main   = { bg = "#ff5555", fg = "#002200", bold = true }
unset_alt    = { bg = "#ff7777", fg = "#002200", bold = true }

# : ]]]

# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#33ff33" }
perm_write = { fg = "#66ff66" }
perm_read  = { fg = "#99ff99" }
perm_exec  = { fg = "#8a8a8a" }
perm_sep   = { fg = "#002200" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#33ff33", bg = "#002200" }
progress_error  = { fg = "#ff5555", bg = "#002200" }

# : ]]]

# : Which [[[

[which]
cols = 3
mask = { bg = "#002200" }
cand = { fg = "#33ff33" }
rest = { fg = "#66ff66" }
desc = { fg = "#8a8a8a" }
separator = " ▶ "
separator_style = { fg = "#33ff33" }

# : ]]]

# : Notify [[[

[notify]
title_info  = { fg = "#33ff33" }
title_warn  = { fg = "#66ff66" }
title_error = { fg = "#ff5555" }

# : ]]]

# : Picker [[[

[pick]
border   = { fg = "#33ff33" }
active   = { fg = "#66ff66", bold = true }
inactive = {}

# : ]]]

# : Input [[[

[input]
border = { fg = "#33ff33" }
value  = { fg = "#33ff33" }

# : ]]]

# : Completion [[[

[cmp]
border = { fg = "#33ff33", bg = "#002200" }

# : ]]]

# : Tasks [[[

[tasks]
border  = { fg = "#33ff33" }
title   = {}
hovered = { fg = "#66ff66", underline = true }

# : ]]]

# : Help [[[

[help]
on     = { fg = "#33ff33" }
run    = { fg = "#66ff66" }
footer = { fg = "#002200", bg = "#33ff33" }

# : ]]]

# : Icon [[[

[icon]
prepend_conds = [
    { if = "dir & hidden", text = "", fg = "#8a8a8a" },
    { if = "dir", text = "", fg = "#33ff33" },
    { if = "orphan", text = "󰌌", fg = "#ff5555" },
    { if = "link", text = "󰌷", fg = "#66ff66" },
    { if = "exec & !dir", text = "󰆧", fg = "#99ff99" },
    { if = "hidden", text = "󰈙", fg = "#8a8a8a" },
]

prepend_dirs = [
    { name = "Desktop", text = "", fg = "#33ff33" },
    { name = "Documents", text = "󰈙", fg = "#33ff33" },
    { name = "Downloads", text = "󰇚", fg = "#33ff33" },
