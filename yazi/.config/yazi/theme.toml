# yazi/theme.toml - 独立荧光绿色系主题
# 仅用于foot/tmux，不依赖DMS

# : Manager [[[

[mgr]
cwd = { fg = "#33ff33" }

# Find
find_keyword  = { fg = "#66ff66", bold = true, italic = true, underline = true }
find_position = { fg = "#66ff66", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#002200", bg = "#33ff33" }
marker_cut      = { fg = "#002200", bg = "#00aa00" }
marker_marked   = { fg = "#002200", bg = "#66ff66" }
marker_selected = { fg = "#002200", bg = "#99ff99" }

# Count
count_copied   = { fg = "#002200", bg = "#33ff33" }
count_cut      = { fg = "#002200", bg = "#00aa00" }
count_selected = { fg = "#002200", bg = "#66ff66" }

# Border
border_symbol = "│"
border_style  = { fg = "#33ff33" }

# : ]]]

# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]

# : Tabs [[[

[tabs]
active    = { fg = "#002200", bold = true, bg = "#33ff33" }
inactive  = { fg = "#33ff33", bg = "#002200" }
sep_inner = { open = "[", close = "]" }

# : ]]]

# : Mode [[[

[mode]
normal_main  = { bg = "#33ff33", fg = "#002200", bold = true }
normal_alt   = { bg = "#66ff66", fg = "#002200", bold = true }
select_main  = { bg = "#00aa00", fg = "#002200", bold = true }
select_alt   = { bg = "#00cc44", fg = "#002200", bold = true }
unset_main   = { bg = "#ff5555", fg = "#002200", bold = true }
unset_alt    = { bg = "#ff7777", fg = "#002200", bold = true }

# : ]]]

# : Status [[[

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#002200", bg = "#002200" }

[status.perm]
r = { fg = "#33ff33" }
w = { fg = "#66ff66" }
x = { fg = "#99ff99" }
s = { fg = "#8a8a8a" }
S = { fg = "#8a8a8a" }
r = { fg = "#8a8a8a" }
o = { fg = "#8a8a8a" }
u = { fg = "#8a8a8a" }
u_plus = { fg = "#8a8a8a" }
g_plus = { fg = "#8a8a8a" }
o_plus = { fg = "#8a8a8a" }
n_plus = { fg = "#8a8a8a" }
u_minus = { fg = "#8a8a8a" }
g_minus = { fg = "#8a8a8a" }
o_minus = { fg = "#8a8a8a" }
n_minus = { fg = "#8a8a8a" }

[status.size]
none  = { fg = "#8a8a8a" }
small = { fg = "#33ff33" }
medium = { fg = "#66ff66" }
large = { fg = "#99ff99" }

[status.mtime]
none  = { fg = "#8a8a8a" }
older = { fg = "#33ff33" }
recent = { fg = "#66ff66" }

# : ]]]

# : Filefluor [[[

[file]
rules = [
    { name = "^/",       fg = "#33ff33" },
    { name = "^README",  fg = "#66ff66", bold = true },
    { name = "^LICENSE", fg = "#99ff99", bold = true },
    { name = ".*rc$",    fg = "#66ff66" },
]

# : ]]]

# : Pick [[[

[pick]
border   = { fg = "#33ff33" }
active   = { fg = "#002200", bg = "#33ff33", bold = true }
inactive = { fg = "#33ff33" }

# : ]]]

# : Input [[[

[input]
border   = { fg = "#33ff33" }
active   = { fg = "#002200", bg = "#33ff33", bold = true }
inactive = { fg = "#33ff33" }

# : ]]]

# : Select [[[

[select]
border   = { fg = "#33ff33" }
active   = { fg = "#002200", bg = "#33ff33", bold = true }
inactive = { fg = "#33ff33" }

# : ]]]

# : Tasks [[[

[tasks]
border   = { fg = "#33ff33" }
active   = { fg = "#002200", bg = "#33ff33", bold = true }
inactive = { fg = "#33ff33" }

# : ]]]

# : Which [[[

[which]
cols  = [ "fg:33ff33" ]

# : ]]]

# : Help [[[

[help]
on      = { fg = "#002200", bg = "#33ff33", bold = true }
active  = { fg = "#33ff33" }
inactive = { fg = "#66ff66" }

# : ]]]
