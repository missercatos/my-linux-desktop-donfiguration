[main]
shell = /usr/bin/zsh -l
font = JetBrains Maple Mono:size=10,Noto Sans CJK SC:size=10
pad = 8x8 center

[environment]
STARSHIP_CONFIG=/home/a/.config/tactical/starship.toml
ZDOTDIR=/home/a/.config/tactical/zsh

[colors-dark]
alpha = 1.0
background = 000000
foreground = 33ff33
regular0 = 002200
regular1 = 005500
regular2 = 00aa00
regular3 = 66ff33
regular4 = 00cc44
regular5 = 00ff66
regular6 = 66ff88
regular7 = b3ffb3
bright0 = 004400
bright1 = 33ff33
bright2 = 66ff66
bright3 = 99ff99
bright4 = 44cc44
bright5 = 00ff88
bright6 = 88ffaa
bright7 = ccffcc
selection-foreground = 002200
selection-background = 33ff33
