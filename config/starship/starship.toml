# tactical/starship.toml
# Auto-generated from DMS theme: tokyoNight
# DO NOT EDIT - Regenerate with: generate-starship-dms
# Language logos use official brand colors

format = '''
┌──(\[$username\]@\[$hostname\])─\[$directory\]─$time $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
└─$character'''

add_newline = true

palette = 'dms'

[palettes.dms]
primary = '#7aa2f7'
secondary = '#bb9af7'
tertiary = '#7aa2f7'
error = '#f7768e'
warning = '#ff9e64'
info = '#7dcfff'
surface = '#73daca'

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold fg:tertiary"
style_root = "bold fg:error"

[hostname]
format = "[$hostname]($style)"
style = "bold fg:surface"
ssh_only = false
trim_at = ""

[directory]
format = "[$path]($style)[$read_only]($style)"
style = "bold fg:secondary"
truncation_length = 3
truncation_symbol = ""
read_only = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = "󰈖 "
"Videos" = "󰈸 "
"Developer" = " "
".local/share" = " "

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vicmd_symbol = "[❮](bold fg:warning)"

[time]
disabled = false
format = "at $time($style)"
time_format = "%R"
style = "bold fg:surface"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "\uf418"
style = "bold fg:primary"

[git_status]
format = '(\[$all_status$ahead_behind\] )'
style = "bold fg:error"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "\ue718"
version_format = "v$raw"
style = "bold #339933"

