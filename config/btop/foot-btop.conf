# btop foot 专用配置 - 荧光绿色主题
# 用法: foot-btop

# 使用绿色主题
color_theme = "green-tty"
theme_background = true
truecolor = true
force_tty = false

# 与主配置相同的紧凑预设
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty cpu:0:tty,mem:0:tty,net:0:tty cpu:0:tty,net:0:tty cpu:0:tty"

update_ms = 1800
background_update = true
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_gpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"
shown_boxes = "cpu mem net proc"
vim_keys = false
disable_mouse = false
rounded_corners = true
terminal_sync = true
