## CAVA 绿色渐变主题 (仅 foot/tty 使用)
## 用法: foot-cava

[general]
 bar_width = 1

[output]
; method = noncurses

[color]
background = 'default'
foreground = 'default'

gradient = 1
gradient_color_1 = '#00cc00'
gradient_color_2 = '#33ff33'
gradient_color_3 = '#66ff66'
gradient_color_4 = '#33ff33'

horizontal_gradient = 0

[smoothing]
; noise_reduction = 77

[eq]
; 1 = 1
; 2 = 1
; 3 = 1
; 4 = 1
; 5 = 1
