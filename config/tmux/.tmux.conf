# ~/.tmux.conf - 独立TUI配置（荧光绿色系）
# 不依赖DMS/kitty，仅用于foot/tmux独立环境

# ── 基础设置 ──
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g clock-mode-style 24

# ── 终端颜色 ──
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── 窗口分割（tmux 默认: % 左右分, " 上下分） ──
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── 面板切换（vim风格） ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── 面板大小调整 ──
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# ── 状态栏（默认样式+电池显示） ──
set -g status on
set -g status-position top
set -g status-interval 1

# 状态栏样式（深色背景）
set -g status-style "bg=colour234,fg=colour248"

# 左侧状态（会话名）
set -g status-left-length 40
set -g status-left "#[fg=colour234,bg=colour75,bold] #S #[fg=colour75,bg=colour234] "

# 右侧状态（电池+主机名+时间）
set -g status-right-length 120
set -g status-right "#[fg=colour248]#(acpi -b 2>/dev/null | awk '{print $4}' | tr -d '%' || echo 'N/A')% #[fg=colour236]│ #[fg=colour75]#h #[fg=colour236]│ #[fg=colour248]%H:%M"

# 窗口标签
setw -g window-status-format "#[fg=colour248] #I:#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour75,bold] #I:#W #[fg=colour75,bg=colour234]"
setw -g window-status-separator ""

# 窗口分隔线
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour75"

# 消息样式
set -g message-style "fg=colour234,bg=colour75,bold"

# ── 复制模式（vim风格） ──
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── 重新加载配置 ──
bind r source-file ~/.tmux.conf \; display "配置已重新加载"

# ── 快速切换窗口 ──
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
