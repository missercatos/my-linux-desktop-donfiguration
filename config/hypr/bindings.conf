$mainMod = SUPER

# ---- Terminal ----
bind = $mainMod, T, exec, kitty --single-instance
bind = $mainMod, Return, exec, kitty
bind = $mainMod, slash, exec, kitty --single-instance --class quickterminal
bind = $mainMod ALT, O, exec, kitty --class opencode -e opencode

# ---- Apps ----
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, sh -c "thunar || env GSK_RENDERER=gl nautilus --new-window"
bind = $mainMod ALT, E, exec, env GSK_RENDERER=gl nautilus --new-window
bind = $mainMod, Z, exec, sh -c "dms ipc call spotlight toggle || fuzzel"
bind = $mainMod ALT, W, exec, dms ipc call dankdash wallpaper
bind = $mainMod SHIFT, F10, exec, ~/.local/bin/random-anime-wallpaper-dms
bind = $mainMod, P, exec, ~/.config/niri/scripts/niri-pick focus

# ---- Close / Kill ----
bind = $mainMod, Q, killactive,
bind = ALT, F4, exec, ~/.config/niri/scripts/niri-force-kill-window
bind = ALT SHIFT, F4, exec, ~/.config/niri/scripts/niri-force-kill-window -f

# ---- Focus navigation (hjkl) ----
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# ---- Window movement (tiled: reorder; floating: moveactive) ----
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, j, movewindow, d
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, A, movewindow, l
bind = $mainMod CTRL, D, movewindow, r

# ---- Float window move (Mod+Alt+hjkl, 按住连续移动) ----
bindr = $mainMod ALT, h, moveactive, -20 0
bindr = $mainMod ALT, j, moveactive, 0 20
bindr = $mainMod ALT, k, moveactive, 0 -20
bindr = $mainMod ALT, l, moveactive, 20 0

# ---- Move window up/down (niri Mod+W → movewindow up) ----
bind = $mainMod, W, movewindow, u
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ---- Column / Window consume/expel (brackets) ----
bind = $mainMod, bracketleft, movewindow, l
bind = $mainMod, bracketright, movewindow, r
bind = $mainMod, A, movewindow, l
bind = $mainMod, D, movewindow, r
bind = $mainMod, comma, movewindow, l
bind = $mainMod, period, movewindow, r
bind = $mainMod SHIFT, A, movewindow, l
bind = $mainMod SHIFT, D, movewindow, r

# ---- Monitor focus ----
bind = $mainMod SHIFT, left, movefocus, mon:l
bind = $mainMod SHIFT, right, movefocus, mon:r
bind = $mainMod SHIFT, up, movefocus, mon:u
bind = $mainMod SHIFT, down, movefocus, mon:d
bind = $mainMod SHIFT, h, movefocus, mon:l
bind = $mainMod SHIFT, j, movefocus, mon:d
bind = $mainMod SHIFT, k, movefocus, mon:u
bind = $mainMod SHIFT, l, movefocus, mon:r

# ---- Move window to monitor ----
bind = $mainMod SHIFT CTRL, left, movewindow, mon:l
bind = $mainMod SHIFT CTRL, right, movewindow, mon:r
bind = $mainMod SHIFT CTRL, up, movewindow, mon:u
bind = $mainMod SHIFT CTRL, down, movewindow, mon:d
bind = $mainMod SHIFT CTRL, h, movewindow, mon:l
bind = $mainMod SHIFT CTRL, j, movewindow, mon:d
bind = $mainMod SHIFT CTRL, k, movewindow, mon:u
bind = $mainMod SHIFT CTRL, l, movewindow, mon:r
bind = $mainMod SHIFT CTRL, A, movewindow, mon:l
bind = $mainMod SHIFT CTRL, D, movewindow, mon:r

# ---- Move workspace to monitor ----
bind = $mainMod SHIFT ALT, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT ALT, right, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT ALT, up, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT ALT, down, movecurrentworkspacetomonitor, d
bind = $mainMod SHIFT ALT, h, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT ALT, j, movecurrentworkspacetomonitor, d
bind = $mainMod SHIFT ALT, k, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT ALT, l, movecurrentworkspacetomonitor, r

# ---- Workspace navigation ----
bind = $mainMod, page_down, workspace, e+1
bind = $mainMod, page_up, workspace, e-1
bind = $mainMod, U, workspace, e+1
bind = $mainMod, I, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod SHIFT, page_down, workspace, r-1
bind = $mainMod SHIFT, page_up, workspace, r+1
bind = $mainMod SHIFT, U, workspace, r-1
bind = $mainMod SHIFT, I, workspace, r+1
bind = $mainMod SHIFT, mouse_down, workspace, r-1
bind = $mainMod SHIFT, mouse_up, workspace, r+1

# ---- Move column to workspace ----
bind = $mainMod CTRL, page_down, movetoworkspace, e+1
bind = $mainMod CTRL, page_up, movetoworkspace, e-1
bind = $mainMod CTRL, U, movetoworkspace, e+1
bind = $mainMod CTRL, I, movetoworkspace, e-1
bind = $mainMod CTRL SHIFT, mouse_down, movetoworkspace, e+1
bind = $mainMod CTRL SHIFT, mouse_up, movetoworkspace, e-1

# ---- Workspace numbers 1-9 ----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# ---- Window operations ----
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, togglespecialworkspace,
bind = $mainMod, N, togglespecialworkspace,
bind = $mainMod ALT, N, togglespecialworkspace,
bind = $mainMod SHIFT, X, togglegroup,
bind = $mainMod, R, layoutmsg, cyclenext
bind = $mainMod SHIFT, R, layoutmsg, swapnext
bind = $mainMod, C, centerwindow,
# ---- Resize (脚本自动适配: 平铺 setwithmod / 浮窗 resizeactive) ----
bind = $mainMod, minus, exec, ~/.config/hypr/scripts/hypr-resize x -
bind = $mainMod, equal, exec, ~/.config/hypr/scripts/hypr-resize x +
bind = $mainMod SHIFT, minus, exec, ~/.config/hypr/scripts/hypr-resize y -
bind = $mainMod SHIFT, equal, exec, ~/.config/hypr/scripts/hypr-resize y +
bind = $mainMod ALT, minus, exec, ~/.config/hypr/scripts/hypr-resize x -
bind = $mainMod ALT, equal, exec, ~/.config/hypr/scripts/hypr-resize x +
bind = $mainMod ALT SHIFT, minus, exec, ~/.config/hypr/scripts/hypr-resize y -
bind = $mainMod ALT SHIFT, equal, exec, ~/.config/hypr/scripts/hypr-resize y +

# ---- Toggle overview (not directly in hyprland, use workspace overview similar) ----
# bind = $mainMod, O, overview:toggle,
bind = $mainMod, O, togglespecialworkspace,
bind = $mainMod, G, togglespecialworkspace,

# ---- Hotkey overlay ----
bind = $mainMod SHIFT, slash, exec, ~/.config/hypr/scripts/hypr-binds

# ---- Fcitx toggle ----
bind = $mainMod, F1, exec, sh -c "pkill fcitx5 || fcitx5"
bind = $mainMod, F2, exec, dms ipc call settings focusOrToggle
bind = $mainMod, F5, exec, quicksave
bind = $mainMod, F8, exec, quickload

# ---- Screen Record ----
bind = $mainMod, F3, exec, ~/.local/bin/wf-recorder-toggle
bind = $mainMod CTRL, R, exec, ~/.local/bin/wf-recorder-toggle

# ---- DMS components ----
bind = $mainMod, X, exec, dms ipc call powermenu toggle
bind = $mainMod, Y, exec, dms ipc call dankdash wallpaper
bind = $mainMod ALT, V, exec, dms ipc call clipboard toggle
bind = $mainMod SHIFT, N, exec, dms ipc call notepad toggle
bind = $mainMod ALT, L, exec, dms ipc call lock lock
bind = $mainMod ALT, P, exec, sh -c "hyprctl dispatch exit && dms ipc call lock lock && systemctl suspend"
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle
bind = $mainMod SHIFT, W, exec, dms ipc call window-rules toggle
bind = $mainMod, Escape, exec, dms ipc call window-rules toggle
bind = CTRL SHIFT, R, exec, dms ipc call workspace-rename open
bind = $mainMod, M, exec, dms ipc call sysmon toggle

# ---- Screenshot ----
bind = $mainMod ALT, A, exec, hyprshot -m region --clipboard-only
bind = $mainMod ALT CTRL, A, exec, hyprshot -m output --clipboard-only
bind = $mainMod ALT CTRL SHIFT, A, exec, hyprshot -m window --clipboard-only
bind = , Print, exec, hyprshot -m output --clipboard-only
bind = CTRL, Print, exec, hyprshot -m output --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region --clipboard-only
bind = $mainMod CTRL, S, exec, wl-paste | satty -f -

# ---- Media controls (via DMS) ----
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindel = , XF86AudioMute, exec, dms ipc call audio mute
bindel = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next
bindl = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 3
bindl = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 3

# ---- Brightness ----
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# ---- Mouse bindings ----
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Mod+middle click → close window
bind = $mainMod, mouse:274, killactive,
