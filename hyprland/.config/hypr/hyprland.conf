source = env.conf
source = input.conf
source = bindings.conf
source = animations.conf
source = monitors.conf
source = startup.conf
source = dms/colors.conf

general {
    gaps_in = 12
    gaps_out = 12
    border_size = 2
    col.active_border = $primary
    col.inactive_border = $outline
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 0.99
    inactive_opacity = 0.99
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(000000b3)
    }
    blur {
        enabled = true
        size = 3
        passes = 3
        noise = 0.02
        contrast = 1.5
        brightness = 1.0
        vibrancy = 0.1696
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
}

master {
    new_status = master
    mfact = 0.5
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_autoreload = true
}
