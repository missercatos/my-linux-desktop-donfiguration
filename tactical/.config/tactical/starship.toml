# tactical/starship.toml
# Unified config for all terminals - Kali Linux style

format = '''
┌──(\[$username\]@\[$hostname\])─\[$directory\]─$time $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
└─$character'''

add_newline = true

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold #d97706"
style_root = "bold #ff0000"

[hostname]
format = "[$hostname]($style)"
style = "bold #3b82f6"
ssh_only = false
trim_at = ""

[directory]
format = "[$path]($style)[$read_only]($style)"
style = "bold #e6d4d8"
truncation_length = 3
truncation_symbol = ""
read_only = ""

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
"Developer" = ""
".local/share" = ""

[character]
success_symbol = "[❯](fg:#339933)"
error_symbol = "[❯](fg:#ff0000)"
vicmd_symbol = "[❮](fg:#d97706)"

[time]
disabled = false
format = "at $time($style)"
time_format = "%R"
style = "fg:#888888"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = ""
style = "fg:#888888"

[git_status]
format = '(\[$all_status$ahead_behind\] )'
style = "fg:#ff6b6b"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "fg:#339933"

[python]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "fg:#FFD43B"

[c]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "fg:#555555"

[cpp]
