# tactical/starship.toml
# Unified config for all terminals
# DMS theme adapted with official Nerd Font symbols

format = '''
┌──(\[$username\]@\[$hostname\])─\[$directory\]─$time $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
└─$character'''

add_newline = true

palette = 'dms'

[palettes.dms]
primary = '#7aa2f7'
secondary = '#73daca'
tertiary = '#bb9af7'
error = '#f7768e'
on_surface = '#c0caf5'
warning = '#e0af68'
success = '#9ece6a'

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold fg:tertiary"
style_root = "bold fg:error"

[hostname]
format = "[$hostname]($style)"
style = "bold fg:on_surface"
ssh_only = false
trim_at = ""

[directory]
format = "[$path]($style)[$read_only]($style)"
style = "bold fg:secondary"
truncation_length = 3
truncation_symbol = ""
read_only = ""

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
"Developer" = ""
".local/share" = ""

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vicmd_symbol = "[❮](bold fg:warning)"

[time]
disabled = false
format = "at [$time]($style) "
time_format = "%R"
style = "bold fg:on_surface"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = ""
style = "bold fg:primary"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold fg:error"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:primary"

[python]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:tertiary"

[c]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:primary"

[cpp]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:primary"

[golang]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[rust]
format = "[$symbol($version)]($style) "
symbol = "7"
version_format = "v$raw"
style = "bold fg:error"

[dart]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[deno]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[elixir]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[haskell]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:tertiary"

[java]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:error"

[julia]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:tertiary"

[kotlin]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:tertiary"

[lua]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[perl]
format = "[$symbol($version)]($style) "
symbol = ""
version_format = "v$raw"
style = "bold fg:secondary"

[php]
