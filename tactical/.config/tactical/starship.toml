# tactical/starship.toml - Dynamic gradient config based on cava theme
# Auto-generated by generate-starship-config

format = """
$username$hostname$directory $time $git_branch$git_status
$character"""

add_newline = true

[username]
style_user = "bold fg:#000000 bg:#e6d4d8"
format = "[ $user ]($style)"

[hostname]
style = "bold fg:#000000 bg:#e6d4d8"
ssh_only = false
format = "─[ @$hostname ]($style)"

[directory]
style = "bold fg:#ffffff bg:#ac3232"
truncation_length = 5
truncate_to_repo = true
format = "─[ $path ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:#ffffff bg:#52263e"
format = "─[ $time ]($style)"

[git_branch]
style = "bold fg:#ac3232"
format = "─[ $symbol$branch ]($style)"

[git_status]
style = "bold fg:#e6d4d8"
format = '[ $all_status$ahead_behind ]($style)'

[c]
disabled = false
symbol = "C:"
style = "bold"
format = "[$symbol$version]($style) "

