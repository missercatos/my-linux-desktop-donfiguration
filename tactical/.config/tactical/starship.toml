format = "$directory$git_branch$git_status$time$character"

add_newline = false

palette = 'tactical'

[palettes.tactical]
green = '#33ff33'
dim = '#66ff66'
gray = '#8a8a8a'
amber = '#ffb000'
red = '#ff5555'

[directory]
style = "bold fg:green"
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
style = "fg:dim"
symbol = "on "
format = "[$symbol$branch]($style) "

[git_status]
style = "bold fg:amber"
format = "[$all_status$ahead_behind]($style) "

[time]
disabled = false
style = "bold fg:gray"
format = "at [$time]($style) "

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
format = "$symbol "
