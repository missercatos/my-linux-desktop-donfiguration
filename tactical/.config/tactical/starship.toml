# tactical/starship.toml - Independent fluorescent green starship config
# For foot/tmux/tty only, independent of DMS/kitty

format = """
[$username](bold fg:green)@[$hostname](bold fg:dim):[$directory](bold fg:green) [$time](bold fg:gray) $git_branch$git_status
> """

add_newline = true

palette = 'green'

[palettes.green]
green = '#33ff33'
dim = '#66ff66'
bright = '#99ff99'
gray = '#8a8a8a'
dark = '#002200'
amber = '#66ff33'
red = '#ff5555'

[username]
style_user = "bold fg:green"
style_root = "bold fg:red"
show_always = true
format = "[$user]($style)"

[hostname]
style = "bold fg:dim"
ssh_only = false
format = "[@$hostname]($style)"

[directory]
style = "bold fg:green"
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:gray"
format = "at [$time]($style) "

[git_branch]
style = "bold fg:bright"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold fg:amber"
format = '[$all_status$ahead_behind]($style) '

[character]
success_symbol = "[>](bold fg:green)"
error_symbol = "[>](bold fg:red)"
format = "$symbol "
