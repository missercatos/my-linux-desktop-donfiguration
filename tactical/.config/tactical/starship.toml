# tactical/starship.toml - Independent fluorescent green starship config
# For foot/tmux/tty only, independent of DMS/kitty
# Language symbols use official brand colors, theme colors follow DMS

format = """
┌──[$username](bold fg:color_primary)-[$hostname](bold fg:color_on_surface dimmed)-[$directory](bold fg:color_secondary)-[$time](bold fg:color_on_surface) $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
└─<$character"""

add_newline = true

palette = 'colors'

[palettes.colors]
color_primary = '#7aa2f7'
color_secondary = '#73daca'
color_tertiary = '#bb9af7'
color_error = '#f7768e'
color_on_surface = '#c0caf5'

[username]
style_user = "bold fg:color_tertiary"
style_root = "bold fg:color_error"
show_always = true
format = "[$user]($style)"

[hostname]
style = "bold fg:color_on_surface dimmed"
ssh_only = false
format = "[@$hostname]($style)"

[directory]
style = "bold fg:color_secondary"
truncation_length = 5
truncate_to_repo = true
format = "[$path]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:color_on_surface"
format = "at [$time]($style) "

[git_branch]
style = "bold bright-green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold bright-red"
format = '[$all_status$ahead_behind]($style) '

# Language modules with official brand colors
[c]
disabled = false
symbol = " "
style = "bold fg:#A8B9CC"
format = "[$symbol$version]($style) "

