# tactical/starship.toml - Dynamic config based on cava theme
# Auto-generated by generate-starship-config

format = """
┌──[](bold fg:#ac3232)-[](bold fg:#e6d4d8 dimmed)-[](bold fg:#52263e)-[at $time](bold fg:#e6d4d8) $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
└─<$character"""

add_newline = true

[username]
style_user = "bold fg:#e6d4d8"
style_root = "bold fg:#ff0000"
show_always = true
format = "[$user]($style)"

[hostname]
style = "bold fg:#e6d4d8 dimmed"
ssh_only = false
format = "[@$hostname]($style)"

[directory]
style = "bold fg:#52263e bg:#ac3232"
truncation_length = 5
truncate_to_repo = true
format = "[ $path ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:#ffffff bg:#ac3232"
format = "[ at $time ]($style) "

[git_branch]
style = "bold fg:#52263e"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold fg:#e6d4d8"
format = '[$all_status$ahead_behind]($style) '

