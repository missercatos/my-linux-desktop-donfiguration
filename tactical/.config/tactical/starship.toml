# Custom module for spinner animation
[custom.spinner]
command = """
if [ -f /tmp/starship-spinner ]; then
    frame=$(cat /tmp/starship-spinner)
    case $frame in
        0) echo "⠋" ;;
        1) echo "⠙" ;;
        2) echo "⠹" ;;
        3) echo "⠸" ;;
        4) echo "⠼" ;;
        5) echo "⠴" ;;
        6) echo "⠦" ;;
        7) echo "⠧" ;;
        8) echo "⠇" ;;
        9) echo "⠏" ;;
        *) echo "⠋" ;;
    esac
else
    echo ""
fi
"""
format = "[$output](bold fg:#ac3232)"
when = true

[character]
success_symbol = "[❯](bold fg:#339933)"
error_symbol = "[❯](bold fg:#ff0000)"
vimcmd_symbol = "[❮](bold fg:#FFD43B)"
format = "$symbol "
