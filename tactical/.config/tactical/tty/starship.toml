# tactical/starship.toml - TTY ASCII-only version
# For pure TTY (no graphical terminal emulator)
# Language symbols use official brand colors

format = """
[$username](bold fg:#33ff33)@[$hostname](bold fg:#66ff66):[$directory](bold fg:#33ff33) [$time](bold fg:#888888) $git_branch$git_status $c$cpp$dart$deno$elixir$golang$haskell$java$julia$kotlin$lua$nodejs$perl$php$python$rlang$ruby$rust$scala$swift$zig
> """

add_newline = true

[username]
style_user = "bold fg:#33ff33"
style_root = "bold fg:#ff5555"
show_always = true
format = "[$user]($style)"

[hostname]
style = "bold fg:#66ff66"
ssh_only = false
format = "[@$hostname]($style)"

[directory]
style = "bold fg:#33ff33"
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:#888888"
format = "at [$time]($style) "

[git_branch]
style = "bold fg:#99ff99"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold fg:#66ff33"
format = '[$all_status$ahead_behind]($style) '

# Language modules with official brand colors (TTY text labels)
[c]
disabled = false
symbol = "C:"
style = "bold fg:#A8B9CC"
format = "[$symbol$version]($style) "

[cpp]
disabled = false
symbol = "C++:"
style = "bold fg:#00599C"
format = "[$symbol$version]($style) "

[dart]
symbol = "Dart:"
style = "bold fg:#0175C2"
format = "[$symbol$version]($style) "

